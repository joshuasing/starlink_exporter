# GitHub Actions workflow to run OpenSSF Scorecard analysis.
name: "Scorecard"
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: "scorecard-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: "Scorecard Analysis"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      security-events: write # Required to upload SARIF output.
      id-token: write # Required for auth when publishing OpenSSF scorecard.
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run Scorecard"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: "results.sarif"
          results_format: "sarif"
          publish_results: true

      - name: "Upload results to code-scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "results.sarif"

      - name: "Upload results as artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "scorecard-results"
          path: "results.sarif"
          retention-days: 5
